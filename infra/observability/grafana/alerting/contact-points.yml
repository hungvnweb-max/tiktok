apiVersion: 1

contactPoints:
  - orgId: 1
    name: videotik-alerting
    receivers:
      - uid: vt_webhook_ops
        type: webhook
        settings:
          url: ${VIDEOTIK_ALERT_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: 10
          title: "[{{ .Status | toUpper }}] Videotik reconciliation alert"
          message: "{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}\n{{ end }}"
      - uid: vt_email_ops
        type: email
        settings:
          addresses: ${VIDEOTIK_ALERT_EMAIL_TO}
          subject: "[{{ .Status | toUpper }}] Videotik reconciliation alert"
          message: "{{ range .Alerts }}{{ .Labels.pipeline }}: {{ .Annotations.summary }}\n{{ end }}"
