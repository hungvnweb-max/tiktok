apiVersion: 1

groups:
  - orgId: 1
    name: videotik-reconciliation
    folder: Videotik
    interval: 1m
    rules:
      - uid: vt_render_consec_fail
        title: Videotik Render Reconcile Consecutive Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS_UID}
            model:
              datasource:
                type: prometheus
                uid: ${DS_PROMETHEUS_UID}
              editorMode: code
              expr: videotik_reconcile_render_consecutive_failures
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          pipeline: render
          service: videotik-api
        annotations:
          summary: Render reconcile is failing repeatedly
          description: Render reconciliation has at least 3 consecutive failures for 5m.

